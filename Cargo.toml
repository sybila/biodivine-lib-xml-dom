[package]
name = "biodivine-lib-xml-dom"
version.workspace = true
edition = "2024"
rust-version.workspace = true

# The Python bindings live in a separate crate (requirement (6): the core crate contains no PyO3
# code at all). The core crate stays the workspace *root package*, so `src/` and every existing
# path and test are untouched by the split.
[workspace]
members = ["biodivine-lib-xml-dom-py-sys"]

# Single source of truth for the release numbers: both crates inherit these, the Python package
# reads its version from the built extension (`biodivine_lib_xml_dom.__version__`) and maturin takes
# the wheel version from `[package] version` via `dynamic = ["version"]`.
[workspace.package]
version = "0.2.0"
# Verified, not aspirational: `cargo +1.88.0 test --workspace` is part of `make verify`, and the CI
# workflow's `min-rust-version` matches this value.
rust-version = "1.88"

# Requirement (7): every public item is documented. `missing_docs` makes that a lint instead of a
# habit, and the docs gate (`RUSTDOCFLAGS="-D warnings" cargo doc`) turns it into a hard failure.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
uninlined_format_args = "warn"

# Note: no `panic = "abort"` in any profile. PyO3 converts a Rust panic into a Python
# `PanicException`, which is only possible while unwinding; `panic = "abort"` would turn a panic
# inside the bindings into a process abort instead.

[dev-dependencies]
proptest = "1"

[dependencies]
parking_lot = "0.12"
quick-xml = "0.41"
thiserror = "2.0"

[lints]
workspace = true