[package]
name = "biodivine-lib-xml-dom-py-sys"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Thin PyO3 wrapper around biodivine-lib-xml-dom (the `_sys` layer)."
# The wrappers reach Python through the `biodivine-sys` extension (the `biodivine-py` repository),
# which depends on this crate through git, pinned to a commit or tag of this repository.
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "biodivine_lib_xml_dom_sys"

[lints]
workspace = true

[dependencies]
biodivine-lib-xml-dom = { path = ".." }
pyo3 = { version = "0.29", features = ["macros"] }

[dev-dependencies]
# `auto-initialize` is what lets `cargo test` start an interpreter in-process.
pyo3 = { version = "0.29", features = ["auto-initialize"] }
